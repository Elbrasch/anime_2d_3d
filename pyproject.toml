[project]
name = "anime-2d-3d"
version = "0.1.0"
description = "Batch 2D -> VR Full SBS video conversion with iw3 + Video Depth Anything, GPU decode/encode pipeline"
readme = "README.md"
license = "MIT"
requires-python = "==3.12.*"
dependencies = [
    # torch + torchvision as pinned by nunif (iw3), CUDA 12.8 builds (see [tool.uv.sources])
    "torch==2.7.1",
    "torchvision==0.22.1",
    # iw3 / nunif runtime (vendor/nunif/requirements.txt without the web server, iw3-player and dev tools)
    "numpy",
    "pillow",
    "requests",
    "tqdm",
    "scipy",
    "diskcache",
    "psutil",
    "pyyaml",
    "platformdirs",
    "packaging",
    "filelock",
    "timm",
    "av==15.0.0",
    "pillow-heif",
    "safetensors",
    "einops",
    "omegaconf",
    "addict",
    # fast_sbs.py: NVENC encoding straight from GPU memory (muxing via av)
    "PyNvVideoCodec==2.2.3",
]

[project.optional-dependencies]
# torch.compile (IW3_EXTRA_ARGS=--compile); also needs the Visual Studio C++ build tools
compile = ["triton-windows>=3.3,<3.4; sys_platform == 'win32'"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# a set of scripts, not an installable package
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs an NVIDIA GPU with CUDA, NVDEC/NVENC and the models from setup.bat"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
